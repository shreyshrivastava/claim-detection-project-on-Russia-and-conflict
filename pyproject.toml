[project]
name = "claim-detection"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "feedparser>=6.0,<7",
    "gunicorn>=23.0,<24",
    "numpy>=2.0,<3",
    "pydantic>=2.8,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.30,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/run_benchmarks.py" = ["E402"]
"evaluation/run_evaluation.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
